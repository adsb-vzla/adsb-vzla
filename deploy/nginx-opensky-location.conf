# Include this location inside the nginx server block serving tar1090.
location = /tar1090/data-opensky/aircraft.json {
    proxy_pass http://127.0.0.1:8087/aircraft.json;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store";
}
