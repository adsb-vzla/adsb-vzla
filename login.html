<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADSB VZLA - Iniciar sesión</title>
  <!-- ***** MODO OSCURO DE SWEETALERT2 ***** -->
  <link rel="stylesheet" href="./static/sweetalert2/dark.css">
  <!-- ***** SWEETALERT2 PARA ALERTAS DE ERROR DE AUTENTICACIÓN ***** -->
  <script src="./static/sweetalert2/sweetalert2.min.js"></script>
  <script src="./static/sweetalert2/sweetalert2.min.css"></script>
  <!-- ***** FONT-AWESOME PARA EL USO DE ÍCONOS ***** -->
  <link rel="stylesheet" href="./static/fontawesome-free-7.2.0-web/css/fontawesome.css" type="text/css" />
  <link rel="stylesheet" href="./static/fontawesome-free-7.2.0-web/css/solid.css" type="text/css" />
  <!-- ***** PROCESAR HOJAS DE CÁLCULO CON FORMATO .XLSX (EXCEL) ***** -->
  <script src="./static/sheetjs/xlsx.full.min.js"></script>
  <!-- ***** ESTILOS ESPECÍFICOS DE LOGIN ***** -->
  <link rel="stylesheet" href="login_style.css">
</head>
<body>
  <!-- ***** CONTENEDOR DEL LOGIN ***** -->
  <main class="login-card">
    <!-- ***** LOGO ***** -->
    <i class="fa-solid fa-plane-departure login-logo"></i>
    <!-- ***** TÍTULO ***** -->
    <h1 class="login-title" data-i18n="login">Log In</h1>
    
    <!-- ***** FORMULARIO ***** -->
    <form id="login-form">

      <!-- ***** USUARIO ***** -->
      <div class="login-field">
        <label for="username" data-i18n="username">Username</label>
        <input id="username" name="username" type="text" required autocomplete="username">
      </div>

      <!-- ***** CONTRASEÑA ***** -->
      <div class="login-field">
        <label for="password" data-i18n="password">Password</label>
        <div class="password-wrapper">
          <input id="password" name="password" type="password" required autocomplete="current-password">
          <button id="toggle-password" class="password-toggle" type="button" aria-pressed="false">
          <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      
      <!-- ***** BOTÓN PARA ACCEDER ***** -->
      <button class="login-submit" type="submit" data-i18n="login">Log In</button>

    </form>

    <!-- ***** SELECTOR DE IDIOMA ***** -->
    <div id="language-selector-container"></div>
  </main>
  <!-- ***** SOPORTE DE IDIOMA ***** -->
  <script src="./static/js/language_patch.js"></script>
  <!-- ***** MOSTRAR/OCULTAR CONTRASEÑA - VALIDACIÓN DE USUARIO - REDIRECCIÓN A INDEX ***** -->
  <script src="./static/js/login-auth.js"></script>
</body>
</html>
